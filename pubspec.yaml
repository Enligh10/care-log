name: care_log
description: Shared medication, vitals and symptom log with a home-screen widget.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ">=4.0.0 <6.0.0"
  firebase_auth: ">=6.0.0 <8.0.0"
  cloud_firestore: ">=6.0.0 <8.0.0"
  home_widget: ^0.10.0
  http: ^1.2.0
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
