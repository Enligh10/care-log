name: Build and publish

# Builds the Android app (APK) and the web version, then publishes both to
# GitHub Pages:
#   web app:  https://<user>.github.io/<repo>/
#   APK:      https://<user>.github.io/<repo>/download/care-log.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      LOG: ${{ github.workspace }}/../ci.log
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and web platform files
        run: |
          flutter --version 2>&1 | tee -a "$LOG"
          flutter create --platforms=android,web --org app.carelog --project-name care_log --no-pub . 2>&1 | tee -a "$LOG"
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py 2>&1 | tee -a "$LOG"

      - name: Check Firebase settings
        run: |
          python3 - <<'EOF' 2>&1 | tee -a "$LOG"
          import json
          cfg = json.load(open("config/firebase.json"))
          missing = [k for k, v in cfg.items() if not v]
          if missing:
              print("::warning::config/firebase.json is missing: " + ", ".join(missing)
                    + ". The app will build but show a setup message until these are filled in.")
          EOF

      - name: Get packages
        run: flutter pub get 2>&1 | tee -a "$LOG"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a "$LOG"

      - name: Test
        run: flutter test 2>&1 | tee -a "$LOG"

      - name: Unlock signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:KEYSTORE_PASSWORD
            echo "CARELOG_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing key unlocked" | tee -a "$LOG"
          else
            echo "::warning::No KEYSTORE_PASSWORD secret, so the APK is signed with a temporary key." | tee -a "$LOG"
          fi

      - name: Build APK
        env:
          CARELOG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CARELOG_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CARELOG_KEY_ALIAS: carelog
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=config/firebase.json 2>&1 | tee -a "$LOG"

      - name: Build web
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define-from-file=config/firebase.json 2>&1 | tee -a "$LOG"

      - name: Add the APK to the site
        run: |
          mkdir -p build/web/download
          cp build/app/outputs/flutter-apk/app-release.apk build/web/download/care-log.apk
          ls -la build/web/download | tee -a "$LOG"

      - uses: actions/upload-artifact@v7
        with:
          name: care-log-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      # Saves the build output to the `ci-logs` branch, to make problems easy
      # to diagnose from anywhere.
      - name: Save build log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          cp "$LOG" "$RUNNER_TEMP/ci-logs/ci.log" 2>/dev/null || echo "(no log)" > "$RUNNER_TEMP/ci-logs/ci.log"
          tail -c 200000 "$RUNNER_TEMP/ci-logs/ci.log" > "$RUNNER_TEMP/ci-logs/ci-tail.log"
          echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}" > "$RUNNER_TEMP/ci-logs/status.txt"
          cd "$RUNNER_TEMP/ci-logs"
          git init -q -b ci-logs
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Build ${{ github.run_number }}: ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
